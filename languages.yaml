en:
  PLUGIN_LIKES_RATINGS:
    USE_BUILT_IN_CSS: Use Built in CSS
    CALLBACK_URL: Callback URL
    CALLBACK_URL_HELP: A path that the plugin will look for when processing Ajax calls
    UNIQUE_IP_CHECK: Unique IP Check
    UNIQUE_IP_CHECK_HELP: Ensures that a particular IP can only vote once
    READ_ONLY: Read Only
    READ_ONLY_HELP: Set to readonly to disable all interaction
    DISABLE_AFTER_VOTE: Disable After Vote
    DISABLE_AFTER_VOTE_HELP: Disable the interaction after the user has already made the vote
    TWIG_TEMPLATE: Twig Template
    TWIG_TEMPLATE_HELP: The twig template to use for rendering the plugin
    RATE_LIMIT_ENABLED: Rate Limit Votes
    RATE_LIMIT_ENABLED_HELP: Reject vote submissions from an IP once it exceeds the configured per-minute limit
    RATE_LIMIT_PER_MINUTE: Votes Per Minute
    RATE_LIMIT_PER_MINUTE_HELP: Maximum vote submissions allowed from a single IP within a 60-second window
    AUTO_CLEANUP_ENABLED: Auto-Cleanup Invalid Ids
    AUTO_CLEANUP_ENABLED_HELP: Periodically remove rows with invalid (non-route-like) ids from the database
    AUTO_CLEANUP_INTERVAL_HOURS: Cleanup Interval (hours)
    AUTO_CLEANUP_INTERVAL_HOURS_HELP: Minimum hours between auto-cleanup sweeps
